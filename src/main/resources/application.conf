ollischema {
  host = "0.0.0.0"
  port = 8110

  # Oeffentlicher Namensraum (ADR-0059). Ein Reverse-Proxy bildet https://bizgrid.de/ollischema/...
  # auf GET /ollischema/... dieses Service ab; die URLs selbst werden nie geparst, sondern abgeleitet.
  namespace = "https://bizgrid.de/ollischema/"

  # kind-UUIDs der Schema-Entities im EntityService (REQ-SCH-001). olliEntity fuehrt kind als UUID; der
  # Default ist die fuer olliSchema reservierte kind-UUID, weitere lassen sich ergaenzen.
  schema-kinds = ["5c4e3a10-0000-4000-8000-000000000001"]

  kafka {
    bootstrap-servers = ["localhost:9092"]
    topic = "entity.events"
    # Versioniert: eine neue Gruppe liest ab earliest. Ein Neuaufbau braucht zusaetzlich eine geleerte
    # Redis (sonst gelten alle Events als Duplikat) oder bin/reproject-main (REQ-SCH-018).
    group-id = "olli-schema-v1"
    client-id = "olli-schema"
    poll-timeout = 500ms
  }

  redis {
    # Eigene Instanz nur fuer olliSchema (ADR-0068), nicht die Redis des EntityIndex.
    host = "localhost"
    port = 6380
  }

  validation {
    # Ausgabelimit fuer die kompakt gespeicherten Fehler (ADR-0064). Volle Listen werden neu berechnet.
    stored-errors = 10
    # Obergrenze fuer volle Fehlerlisten der API.
    max-errors = 1000
    # Ressourcenlimits (ADR-0069).
    max-document-bytes = 2097152
    # Groesste validierte Instanz (Entity-Daten bzw. Body von POST /validate), SCH-A07.
    max-instance-bytes = 5242880
    max-reference-depth = 32
    max-referenced-schemas = 200
    regex-timeout = 200ms
    # Frist je Validierung (Instanz und Metaschema); bricht die Arbeit kooperativ ab, auch im Consumer
    # und in der Neuvalidierung (SCH-A07).
    max-validation-time = 2s
    # Antwortzeitgrenze der API; sollte ueber max-validation-time liegen.
    api-timeout = 10s
    # Anzahl kompilierter Released-Schemas im Speicher (Drafts werden nie gecacht, ADR-0059).
    compiled-cache-size = 500
  }

  revalidation {
    # Gedrosselte Neuvalidierung der Entities gegen geaenderte Drafts (ADR-0061).
    interval = 2s
    batch = 50
  }

  entity-index {
    # CheckReferer fragt die Verwender eines Schemas beim EntityIndex ab (REQ-SCH-006).
    base-url = "http://localhost:8081"
    base-url = ${?OLLI_SCHEMA_ENTITY_INDEX_URL}
    page-size = 500
    max-entities = 5000
    timeout = 5s
  }

  entity-registry {
    # Ziel der Schema-Entities aus einem Fremdschema-Import (REQ-SCH-013).
    base-url = "http://localhost:8080"
    base-url = ${?OLLI_SCHEMA_ENTITY_REGISTRY_URL}
    timeout = 10s
  }

  import {
    # Ohne Eintrag ist der Import abgeschaltet. Import-Recht ist vom Release-Recht getrennt (ADR-0069).
    allowed-principals = []
    # Exakte Hosts oder Suffixe mit fuehrendem Punkt (".buildingsmart.org").
    allowed-hosts = []
    allow-http = false
    max-bytes = 5242880
    connect-timeout = 5s
    request-timeout = 20s
    max-documents = 50
    # origin der Schreibaufrufe an die EntityRegistry.
    origin = "5c4e3a10-0000-4000-8000-00000000000a"
  }
}
